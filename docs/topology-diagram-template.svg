<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- FDE Experience Day — Stage 1 Milestone 1 topology template.
       Import into Excalidraw or diagrams.net (both support SVG import/
       trace), or annotate directly if your tool supports SVG editing.
       Your job: draw the masking boundary line (dashed, see the labeled
       example on the right) at the point YOUR Solution Boundaries
       worksheet says it should go — the position shown here is a
       placeholder, not the answer. -->

  <rect width="900" height="420" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">
    Integration Topology — Starting Shape
  </text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#666666">
    Annotate: where does YOUR masking boundary actually go?
  </text>

  <!-- Legacy DB -->
  <rect x="40" y="150" width="150" height="80" rx="8" fill="#e8f0fe" stroke="#4a86e8" stroke-width="2"/>
  <text x="115" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Legacy DB</text>
  <text x="115" y="203" text-anchor="middle" font-size="11" fill="#444444">legacy_bank.db</text>
  <text x="115" y="217" text-anchor="middle" font-size="11" fill="#444444">(SQLite)</text>

  <!-- MCP Server -->
  <rect x="260" y="150" width="150" height="80" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="335" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">MCP Server</text>
  <text x="335" y="203" text-anchor="middle" font-size="11" fill="#444444">get_account_balance</text>
  <text x="335" y="217" text-anchor="middle" font-size="11" fill="#444444">+ 2 more tools</text>

  <!-- Agent Gateway -->
  <rect x="480" y="150" width="150" height="80" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="555" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Agent Gateway</text>
  <text x="555" y="203" text-anchor="middle" font-size="11" fill="#444444">routing, telemetry,</text>
  <text x="555" y="217" text-anchor="middle" font-size="11" fill="#444444">participant tagging</text>

  <!-- Foundry -->
  <rect x="700" y="150" width="150" height="80" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="775" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Microsoft Foundry</text>
  <text x="775" y="203" text-anchor="middle" font-size="11" fill="#444444">GPT-5.1 / DeepSeek</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <line x1="190" y1="190" x2="255" y2="190" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="190" x2="475" y2="190" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="190" x2="695" y2="190" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Example masking boundary annotation (placeholder position) -->
  <line x1="440" y1="120" x2="440" y2="280" stroke="#9334e6" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="440" y="110" text-anchor="middle" font-size="11" fill="#9334e6" font-weight="bold">
    ← example only — put yours where YOUR worksheet says
  </text>

  <!-- Legend -->
  <rect x="40" y="320" width="16" height="16" fill="none" stroke="#9334e6" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="64" y="333" font-size="12" fill="#333333">Masking boundary — what crosses this line into the public-cloud LLM path, and what doesn't</text>

  <text x="40" y="365" font-size="11" fill="#888888">
    Reference for Milestone 1: annotate this shape with your own masking-boundary decision from the Solution Boundaries worksheet.
  </text>
  <text x="40" y="382" font-size="11" fill="#888888">
    This diagram is referenced again at Spotlight Defense close — it's the architecture reference for the whole day, not a one-off exercise.
  </text>
</svg>
