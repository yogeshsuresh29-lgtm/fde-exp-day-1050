#                    the customer_id it was authenticated for"
#     effect: deny
#     when:
#       tool: [get_account_balance, get_transaction_history, get_customer_profile]
#       condition: "input.customer_id != session.authenticated_customer_id"
#
#   - id: wire-transfer-approval-threshold
#     description: "Wire transfers above the threshold require human approval"
#     effect: require_approval
#     when:
#       tool: [initiate_wire_transfer]
#       condition: "input.amount_cents > policy.wire_transfer_threshold_cents"
#
# Participants write real rules here, following this shape. A fixed
# adversarial scenario suite (see eval/eval-step-requirements.md) runs
# against these rules — vague or missing rules mean the suite exposes
# gaps, not a failure it can paper over.
