# ACS policy TEMPLATE — reference only. Stage 3's actual exercise is
# copying this to governance/policy.yaml (which doesn't exist in the
# repo yet) and filling it in for real, codifying Stage 1's Solution
# Boundaries worksheet into an enforced rule.
#
# cd.yml gates its governance step on governance/policy.yaml existing
# at all (hashFiles() returns empty for an absent file) — that's why
# this template lives here in docs/ instead of at the live path.
# Copying it in at Stage 3 is what flips the gate; nothing before that
# accidentally triggers governance checks during Stage 2.
#
# apiVersion: acs/v1
