properties:
  template:
    containers:
      - name: bank
        image: ${IMAGE}
        resources:
          cpu: 0.5
          memory: 1Gi
        ports:
          - port: 8080
            protocol: TCP
        env:
          - name: ASPNETCORE_URLS
            value: "http://+:8080"
          - name: FDE_PARTICIPANT_ID
            value: "${FDE_PARTICIPANT_ID}"
          - name: FDE_NUMERIC_ID
            value: "${FDE_NUMERIC_ID}"
          - name: FDE_POD_ID
            value: "${FDE_POD_ID}"
          - name: FDE_EVENT_ID
            value: "${FDE_EVENT_ID}"
          - name: FDE_WORKLOAD_TYPE
            value: "${FDE_WORKLOAD_TYPE}"
          - name: FDE_AGENT_GATEWAY_ENDPOINT
            value: "${FDE_AGENT_GATEWAY_ENDPOINT}"
          - name: FDE_AGENT_GATEWAY_KEY
            value: "${FDE_AGENT_GATEWAY_KEY}"
          - name: FDE_LANGFUSE_OTLP_ENDPOINT
            value: "${FDE_LANGFUSE_OTLP_ENDPOINT}"
          - name: FDE_LANGFUSE_OTLP_HEADERS
            value: "${FDE_LANGFUSE_OTLP_HEADERS}"
    scale:
      minReplicas: 1
      maxReplicas: 2
  configuration:
    ingress:
      external: true
      targetPort: 8080
      transport: http